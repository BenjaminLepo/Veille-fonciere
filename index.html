<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veille foncière SRU</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d2329;--mute:#66707a;--line:#e3e0da;--acc:#1f5c8a;--ok:#2e7d4f;--warn:#a86a12;--bad:#a33a3a;--chip:#eef2f6}
@media (prefers-color-scheme:dark){:root{--bg:#15181b;--card:#1e2226;--ink:#e8eaec;--mute:#9aa3ab;--line:#2f353a;--acc:#6aa8d8;--ok:#6cc08f;--warn:#e0a54a;--bad:#e07a7a;--chip:#262c32}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:28px 16px 12px;max-width:1100px;margin:0 auto}
h1{margin:0;font-size:24px;letter-spacing:-.01em}
.sub{color:var(--mute);margin-top:4px;font-size:14px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--mute);font-size:12px}
.bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.bar>div{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input[type=search]{flex:1 1 200px}
label.chk{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:14px}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.com{font-weight:650;font-size:16px}
.com small{color:var(--mute);font-weight:400}
.score{font-weight:700;font-size:18px;min-width:44px;text-align:center;border-radius:8px;padding:2px 6px;background:var(--chip)}
.titre{color:var(--mute);font-size:14px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kv div{background:var(--chip);border-radius:8px;padding:6px 8px}
.kv b{display:block;font-size:15px}
.kv span{font-size:11px;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--mute)}
.s-nouveau{color:var(--acc)}.s-a_etudier{color:var(--warn)}.s-contacte{color:var(--ok)}.s-retenu{color:var(--ok);font-weight:600}.s-ecarte{color:var(--bad)}
.why{font-size:13px;color:var(--mute)}
.hist{font-size:12px;color:var(--warn)}
.links a{color:var(--acc);font-size:14px;margin-right:12px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px}
#auth{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--mute)}
#auth input{min-width:220px}
button{font:inherit;cursor:pointer;border-radius:8px;padding:7px 12px;border:1px solid var(--acc);background:var(--acc);color:#fff}
button.ghost{background:transparent;color:var(--acc)}
.edit{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.edit select,.edit textarea{font:inherit;font-size:14px;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.edit textarea{min-height:52px;resize:vertical}
.saved{font-size:12px;color:var(--ok)}.err{color:var(--bad)}
footer{max-width:1100px;margin:0 auto;padding:8px 16px 32px;color:var(--mute);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Veille foncière — communes SRU Nord, Pas-de-Calais, Oise</h1>
  <div class="sub" id="maj">Chargement…</div>
  <div class="stats" id="stats"></div>
  <div id="auth"></div>
</header>
<div class="bar"><div>
  <input type="search" id="q" placeholder="Rechercher une commune, un type…">
  <select id="dep"><option value="">Tous départements</option><option>59</option><option>62</option><option>60</option></select>
  <select id="st"><option value="actifs">À traiter et suivis</option><option value="">Tous les statuts</option><option value="nouveau">Nouveau</option><option value="a_etudier">À étudier</option><option value="contacte">Contacté</option><option value="retenu">Retenu</option><option value="ecarte">Écarté</option></select>
  <select id="tri"><option value="score">Tri : score</option><option value="date">Tri : plus récents</option><option value="pm2">Tri : €/m² terrain</option><option value="surface">Tri : surface</option></select>
</div></div>
<main id="list"></main>
<footer>Mise à jour automatique chaque lundi à partir des alertes Leboncoin et Bien'ici. Zonage PLU indicatif, à confirmer sur le Géoportail de l'Urbanisme.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL="https://yfzejzxdaujnvuzxcqvp.supabase.co";
const SUPABASE_KEY="sb_publishable_i9-JAAq3EXUPXeXvhVetug_Pg34Zo07";
const LIB={nouveau:"Nouveau",a_etudier:"À étudier",contacte:"Contacté",retenu:"Retenu",ecarte:"Écarté"};
const fmt=n=>n==null?"n.c.":Math.round(n).toLocaleString("fr-FR");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https:\/\//.test(u||"")?u:"#";
let DATA=[],SB=null,EDIT=false,USER=null;
const SITE=location.origin+location.pathname;
try{if(window.supabase&&!SUPABASE_URL.startsWith("__"))SB=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);}catch(e){}
function zonage(z){if(!z||!z.statut)return '<span class="chip">Zonage à vérifier</span>';
  const c={oui:"constructible",non:"non constructible",partiel:"partiellement constructible"}[z.constructible]||"zonage inconnu";
  return `<span class="chip">${esc(z.zone?z.zone+" · ":"")}${c} (${esc(z.statut)})</span>`}
function card(f){
  const h=(f.historiquePrix||[]);const baisse=h.length>1&&h[h.length-1].prix<h[0].prix;
  const autres=(f.autresAnnonces||[]).map((u,i)=>`<a href="${esc(safeUrl(u))}" target="_blank" rel="noopener">Autre annonce ${i+1}</a>`).join("");
  return `<article class="card">
  <div class="top"><div class="com">${esc(f.commune)} <small>${f.rang?"rang "+f.rang+" · ":""}${esc(f.dep)}</small></div><div class="score" title="Score /100">${f.score??"–"}</div></div>
  <div class="titre">${esc(f.titre)}</div>
  <div class="kv"><div><b>${f.surface==null?"n.c.":fmt(f.surface)+" m²"}</b><span>terrain</span></div><div><b>${fmt(f.prix)} €</b><span>prix</span></div><div><b>${fmt(f.prixM2)}</b><span>€/m² terrain${f.pm2Terrain?" (réf. "+fmt(f.pm2Terrain)+")":""}</span></div></div>
  <div class="chips"><span class="chip s-${esc(f.statut)}">${LIB[f.statut]||esc(f.statut)}</span>${zonage(f.zonage)}<span class="chip">${esc(f.source)}</span><span class="chip">vu le ${esc((f.dateAnnonce||"").split("-").reverse().join("/"))}</span></div>
  ${baisse?`<div class="hist">Baisse de prix : ${fmt(h[0].prix)} → ${fmt(h[h.length-1].prix)} €</div>`:""}
  <div class="why">${esc(f.pourquoi)}</div>
  ${EDIT?editBlock(f):""}
  <div class="links"><a href="${esc(safeUrl(f.url))}" target="_blank" rel="noopener">Voir l'annonce</a>${autres}</div>
  </article>`}
function editBlock(f){
  const opts=Object.entries(LIB).map(([k,v])=>`<option value="${k}"${k===f.statut?" selected":""}>${v}</option>`).join("");
  return `<div class="edit" data-id="${esc(f.id)}"><select class="e-st">${opts}</select>
  <textarea class="e-note" placeholder="Note (visible des seuls éditeurs)">${esc(f.note||"")}</textarea>
  <div><button class="e-save">Enregistrer</button> <span class="e-msg"></span>${f.par?`<span class="e-msg"> modifié par ${esc(f.par)}</span>`:""}</div></div>`}
async function save(box){
  const id=box.dataset.id,statut=box.querySelector(".e-st").value,note=box.querySelector(".e-note").value,msg=box.querySelector(".e-msg");
  msg.className="e-msg";msg.textContent="Enregistrement…";
  const {error}=await SB.from("statuts").upsert({id,statut,note});
  if(error){msg.className="e-msg err";msg.textContent="Échec : "+error.message;return}
  const f=DATA.find(x=>x.id===id);if(f){f.statut=statut;f.note=note;f.par=USER}
  msg.className="e-msg saved";msg.textContent="Enregistré";stats();
}
document.addEventListener("click",e=>{const b=e.target.closest(".e-save");if(b)save(b.closest(".edit"))});
async function auth(){
  const el=document.getElementById("auth");
  if(!SB){el.textContent="";return}
  const {data:{session}}=await SB.auth.getSession();
  if(!session){
    el.innerHTML='<span>Modifier les statuts :</span><input type="email" id="mail" placeholder="votre e-mail"><button id="go">Recevoir un lien de connexion</button><span id="amsg"></span>';
    document.getElementById("go").onclick=async()=>{const m=document.getElementById("mail").value.trim();if(!m)return;
      const {error}=await SB.auth.signInWithOtp({email:m,options:{emailRedirectTo:SITE}});
      document.getElementById("amsg").textContent=error?"Erreur : "+error.message:"Lien envoyé, ouvrez votre boîte mail.";};
    EDIT=false;return}
  USER=session.user.email;
  const {data:ed}=await SB.from("editeurs").select("email");
  EDIT=!!(ed&&ed.length);
  el.innerHTML=`<span>Connecté : ${esc(USER)}${EDIT?"":" (lecture seule : adresse non autorisée)"}</span><button class="ghost" id="out">Se déconnecter</button>`;
  document.getElementById("out").onclick=async()=>{await SB.auth.signOut();location.reload()};
  if(EDIT){const {data}=await SB.from("statuts").select("id,statut,note,par");
    const m=new Map((data||[]).map(r=>[r.id,r]));DATA.forEach(f=>{const r=m.get(f.id);if(r){f.statut=r.statut;f.note=r.note;f.par=r.par}})}
}
function stats(){const n=s=>DATA.filter(f=>f.statut===s).length;
  document.getElementById("stats").innerHTML=[["Fonciers suivis",DATA.length],["Nouveaux",n("nouveau")],["À étudier",n("a_etudier")],["Contactés",n("contacte")],["Retenus",n("retenu")]].map(([a,b])=>`<div class="stat"><b>${b}</b><span>${a}</span></div>`).join("")}
function render(){
  const q=document.getElementById("q").value.trim().toLowerCase(),dep=document.getElementById("dep").value,st=document.getElementById("st").value,tri=document.getElementById("tri").value;
  let l=DATA.filter(f=>(!dep||f.dep===dep)&&(st===""||(st==="actifs"?f.statut!=="ecarte":f.statut===st))&&(!q||[f.commune,f.titre,f.type,f.source].join(" ").toLowerCase().includes(q)));
  const k={score:f=>-(f.score??-1),date:f=>-(Date.parse(f.dateAnnonce)||0),pm2:f=>f.prixM2??1e9,surface:f=>-(f.surface??0)}[tri];
  l.sort((a,b)=>k(a)-k(b));
  document.getElementById("list").innerHTML=l.length?l.map(card).join(""):'<div class="empty">Aucun foncier ne correspond à ces filtres.</div>';
}
fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{
  DATA=d.fonciers||[];
  const m=d.maj?new Date(d.maj):null;
  document.getElementById("maj").textContent="Dernière mise à jour : "+(m?m.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}):"inconnue");
  stats();render();
  auth().then(()=>{stats();render()}).catch(()=>{});
}).catch(()=>{document.getElementById("maj").textContent="Données indisponibles pour le moment.";});
["q","dep","st","tri"].forEach(i=>document.getElementById(i).addEventListener("input",render));
</script>
</body>
</html>
